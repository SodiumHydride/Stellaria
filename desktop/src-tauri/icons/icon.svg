<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 星籁 Stellaria app icon, 旋律星: a phrase of melody whose highest note is a star, ink on a
       paper tile. The mark is the same geometry as src/components/Logo.tsx (100-unit box),
       scaled ×7.6 into the tile's middle. Regenerate every size with scripts/icons.sh. -->
  <defs>
    <linearGradient id="tile" x1="0.18" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#fcfaf6"/>
      <stop offset="1" stop-color="#e0dbd2"/>
    </linearGradient>
    <radialGradient id="sheen" cx="30%" cy="18%" r="75%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#3a3530" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#3a3530" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.8" flood-color="#3a3530" flood-opacity="0.16"/>
    </filter>
    <clipPath id="clip">
      <rect width="1024" height="1024" rx="228" ry="228"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1024" height="1024" fill="url(#tile)"/>
    <rect width="1024" height="1024" fill="url(#sheen)"/>
    <g transform="translate(132 194) scale(7.6)" filter="url(#lift)">
      <path d="M9 62C16 62 19 47 26 47S36 75 45 75S56 37 65 37S78 62 91 62" fill="none" stroke="#3a3530" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path transform="translate(65 17)" fill="#a9736a" d="M0 -12C0.8 -3.13 3.13 -0.8 12 0C3.13 0.8 0.8 3.13 0 12C-0.8 3.13 -3.13 0.8 -12 0C-3.13 -0.8 -0.8 -3.13 0 -12Z"/>
    </g>
    <rect x="3" y="3" width="1018" height="1018" rx="225" ry="225" fill="none" stroke="url(#rim)" stroke-width="6"/>
  </g>
</svg>
