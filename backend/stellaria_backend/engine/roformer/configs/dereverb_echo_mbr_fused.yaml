# Model settings of the fused dereverb + de-echo Mel-Band-Roformer checkpoint by Sucial and the
# MSST-WebUI community (dereverb_echo_mbr_fused_0.5_v2_0.25_big_0.25_super.ckpt), as published
# next to the checkpoint by MSST-WebUI (configs_backup/single_stem_models). Only what inference
# needs is kept: the training-only settings (optimizer, augmentation) are left out.
audio:
  chunk_size: 352800
  dim_f: 1024
  dim_t: 801
  hop_length: 441
  min_mean_abs: 0.0
  n_fft: 2048
  num_channels: 2
  sample_rate: 44100
inference:
  batch_size: 1
  dim_t: 801
  num_overlap: 4
model:
  attn_dropout: 0.1
  depth: 8
  dim: 256
  dim_freqs_in: 1025
  dim_head: 64
  ff_dropout: 0.1
  flash_attn: true
  freq_transformer_depth: 1
  heads: 8
  linear_transformer_depth: 0
  mask_estimator_depth: 2
  multi_stft_hop_size: 147
  multi_stft_normalized: false
  multi_stft_resolution_loss_weight: 1.0
  multi_stft_resolutions_window_sizes: !!python/tuple
  - 4096
  - 2048
  - 1024
  - 512
  - 256
  num_bands: 60
  num_stems: 1
  sample_rate: 44100
  stereo: true
  stft_hop_length: 441
  stft_n_fft: 2048
  stft_normalized: false
  stft_win_length: 2048
  time_transformer_depth: 1
training:
  instruments:
  - dry
  - other
  target_instrument: dry
  use_amp: true
